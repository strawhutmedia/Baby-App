name: Deploy to GitHub Pages

# Deploys run from main only — development-branch pushes are blocked by the
# github-pages environment anyway and each blocked twin run emailed a failure.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue rapid successive deploys instead of cancelling the older one —
# cancelled runs generate misleading "not successful" notification emails.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - run: npm run build
        env:
          # Family-sync server URL (Railway). Set in repo Settings → Secrets and
          # variables → Actions → Variables. Empty = app runs on-device only.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
